name: PR Check

on:
  pull_request:
  push:

permissions:
  contents: read
  statuses: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Pass check
        run: echo "PR check passed"

      - name: Publish legacy commit status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MERGE_SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          state="$JOB_STATUS"
          if [ "$state" = "cancelled" ]; then
            state="error"
          fi

          published=""
          for commit_sha in "$HEAD_SHA" "$MERGE_SHA"; do
            if [ -z "$commit_sha" ] || [ "$commit_sha" = "$published" ]; then
              continue
            fi

            published="$commit_sha"
            curl -sS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${{ github.api_url }}/repos/${{ github.repository }}/statuses/$commit_sha" \
              -d "{\"state\":\"$state\",\"context\":\"PR Check / legacy status\",\"description\":\"PR check $state\",\"target_url\":\"$RUN_URL\"}"
          done
